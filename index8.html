<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Delhi Metro Live Tracking</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    overflow:hidden;
}

/* =========================
   MAP
========================= */

#map{
    width:100%;
    height:100vh;
}

/* =========================
   INFO PANEL
========================= */

.infoBox{
    position:absolute;
    top:10px;
    right:10px;
    z-index:9999;

    width:320px;

    background:white;
    border-radius:14px;

    padding:14px;

    box-shadow:0 4px 15px rgba(0,0,0,0.25);
}

.infoBox h2{
    font-size:20px;
    margin-bottom:10px;
}

.row{
    margin-bottom:10px;
    font-size:15px;
}

.label{
    font-weight:bold;
}

/* =========================
   BUTTONS
========================= */

.buttonWrap{
    display:flex;
    gap:10px;
    margin-top:10px;
}

.btn{
    flex:1;
    padding:10px;
    border:none;
    border-radius:8px;
    font-size:14px;
    cursor:pointer;
}

.yesBtn{
    background:green;
    color:white;
}

.noBtn{
    background:red;
    color:white;
}

/* =========================
   MOBILE RESPONSIVE
========================= */

@media(max-width:768px){

    .infoBox{

        width:95%;

        left:50%;
        right:auto;

        transform:translateX(-50%);

        top:auto;
        bottom:10px;

        padding:12px;
    }

    .infoBox h2{
        font-size:18px;
    }

    .row{
        font-size:14px;
    }

    .btn{
        padding:12px;
        font-size:15px;
    }
}

</style>
</head>

<body>

<div id="map"></div>

<!-- =========================
     INFO PANEL
========================= -->

<div class="infoBox">

    <h2>🚇 Metro Tracking</h2>

    <div class="row">
        <span class="label">Speed:</span>
        <span id="speed">0</span> km/h
    </div>

    <div class="row">
        <span class="label">Current Station:</span>
        <span id="currentStation">-</span>
    </div>

    <div class="row">
        <span class="label">Next Station:</span>
        <span id="nextStation">-</span>
    </div>

    <div class="row">
        <span class="label">ETA:</span>
        <span id="eta">-</span>
    </div>

    <div class="row">
        <span class="label">Metro Status:</span>
        <span id="metroStatus">Not in Metro</span>
    </div>

    <div id="metroQuestion">

        <div class="row">
            <b>Are you inside Metro?</b>
        </div>

        <div class="buttonWrap">

            <button class="btn yesBtn"
            onclick="insideMetro(true)">
                YES
            </button>

            <button class="btn noBtn"
            onclick="insideMetro(false)">
                NO
            </button>

        </div>
    </div>

    <div class="row">
    <span class="label">Distance:</span>
    <span id="distance">-</span>
</div>

<div class="row">
    <span class="label">Metro Line:</span>
    <span id="metroStatus">Not in Metro</span>
</div>

</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

// =========================
// DRAW METRO
// =========================

Object.keys(metroData).forEach(function(lineName){

    let line = metroData[lineName];

    let coordinates = [];

    line.stations.forEach(function(station){

        coordinates.push([
            station.lat,
            station.lng
        ]);

        // Station Marker
        L.circleMarker(
            [station.lat,station.lng],
            {
                radius:8,
                color:line.color,
                fillColor:line.color,
                fillOpacity:1
            }
        )
        .addTo(map)
        .bindPopup(
            "<b>"+station.name+"</b>"
        );

        // GEOFENCE ALWAYS SHOW
        L.circle(
            [station.lat,station.lng],
            {
                radius:200,
                color:line.color,
                fillColor:line.color,
                fillOpacity:0.08,
                weight:2
            }
        ).addTo(map);

    });

    // Metro Line
    L.polyline(
        coordinates,
        {
            color:line.color,
            weight:5
        }
    ).addTo(map);

});


// =========================
// GLOBAL VARIABLES
// =========================

var userMarker;

var isInsideMetro = false;

var currentLine = null;

var currentStationIndex = -1;

var nearestDistance = 0;

var promptShown = false;


// =========================
// LIVE LOCATION
// =========================

function onLocationFound(e){

    const lat = e.latlng.lat;
    const lng = e.latlng.lng;

    // Remove old marker
    if(userMarker){
        map.removeLayer(userMarker);
    }

    // User marker
    userMarker = L.circleMarker(
        [lat,lng],
        {
            radius:10,
            color:"blue",
            fillColor:"blue",
            fillOpacity:1
        }
    ).addTo(map);

    // Auto center
    map.setView([lat,lng]);

    // =====================
    // SPEED
    // =====================

    let gpsSpeed = 0;

    if(e.speed){

        gpsSpeed =
        (e.speed * 3.6).toFixed(2);

    }

    document.getElementById(
        "speed"
    ).innerHTML = gpsSpeed;


    // =====================
    // CHECK GEOFENCE
    // =====================

    checkMetroGeofence(lat,lng);


    // =====================
    // IF INSIDE METRO
    // =====================

    if(
        isInsideMetro &&
        currentLine !== null
    ){

        let stations =
        metroData[currentLine].stations;

        let nearestStation =
        stations[currentStationIndex];

        // Current station
        document.getElementById(
            "currentStation"
        ).innerHTML =
        nearestStation.name;

        // Distance
        document.getElementById(
            "distance"
        ).innerHTML =
        nearestDistance.toFixed(2)
        + " KM";


        // =====================
        // NEXT STATION
        // =====================

        let nextIndex =
        currentStationIndex + 1;

        if(nextIndex < stations.length){

            let nextStation =
            stations[nextIndex];

            document.getElementById(
                "nextStation"
            ).innerHTML =
            nextStation.name;

            // Distance to next station
            let nextDistance =
            getDistance(
                lat,
                lng,
                nextStation.lat,
                nextStation.lng
            );

            // ETA
            let speedUsed =
            gpsSpeed > 5
            ? gpsSpeed
            : 35;

            let eta =
            ((nextDistance/speedUsed)*60)
            .toFixed(1);

            document.getElementById(
                "eta"
            ).innerHTML =
            eta + " mins";
        }
    }

}


// =========================
// GEOFENCE DETECTION
// =========================

function checkMetroGeofence(lat,lng){

    let foundStation = false;

    Object.keys(metroData)
    .forEach(function(lineName){

        let line =
        metroData[lineName];

        line.stations
        .forEach(function(station,index){

            let distance =
            getDistance(
                lat,
                lng,
                station.lat,
                station.lng
            );

            // Inside 200m geofence
            if(distance <= 0.2){

                foundStation = true;

                currentLine = lineName;

                currentStationIndex = index;

                nearestDistance = distance;

                // Show question only once
                if(!promptShown){

                    document.getElementById(
                        "metroQuestion"
                    ).style.display =
                    "block";

                    promptShown = true;
                }

            }

        });

    });

    // Reset if outside all stations
    if(!foundStation){

        promptShown = false;

        document.getElementById(
            "metroQuestion"
        ).style.display =
        "none";
    }

}


// =========================
// USER CLICK YES / NO
// =========================

function insideMetro(value){

    isInsideMetro = value;

    document.getElementById(
        "metroStatus"
    ).innerHTML =
    value
    ? "Inside Metro"
    : "Not in Metro";

    document.getElementById(
        "metroQuestion"
    ).style.display =
    "none";

}


// =========================
// DISTANCE CALCULATION
// =========================

function getDistance(
    lat1,
    lon1,
    lat2,
    lon2
){

    const R = 6371;

    const dLat =
    deg2rad(lat2-lat1);

    const dLon =
    deg2rad(lon2-lon1);

    const a =

    Math.sin(dLat/2) *
    Math.sin(dLat/2)

    +

    Math.cos(
        deg2rad(lat1)
    )

    *

    Math.cos(
        deg2rad(lat2)
    )

    *

    Math.sin(dLon/2) *
    Math.sin(dLon/2);

    const c =
    2 * Math.atan2(
        Math.sqrt(a),
        Math.sqrt(1-a)
    );

    return R * c;
}

function deg2rad(deg){

    return deg * (Math.PI/180);

}


// =========================
// GPS ERROR
// =========================

function onLocationError(){

    alert(
        "Please allow GPS permission"
    );

}


// =========================
// START GPS
// =========================

map.locate({

    watch:true,

    enableHighAccuracy:true,

    maximumAge:0

});

map.on(
    'locationfound',
    onLocationFound
);

map.on(
    'locationerror',
    onLocationError
);

</script>
